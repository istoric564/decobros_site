# Example nginx server block. Adjust server_name, root and TLS paths.
server {
  listen 443 ssl http2;
  server_name _;                # TODO: real domain
  root /var/www/decobroscrew;   # TODO: real path
  index index.html;
  error_page 404 /404.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;

  # Log retention: set a short period in logrotate. Document it in /privacy.
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ =404; }
  # Localized 404 pages.
  location /en/ { error_page 404 /en/404/index.html; try_files $uri $uri/ =404; }
  location /zh/ { error_page 404 /zh/404/index.html; try_files $uri $uri/ =404; }
}
